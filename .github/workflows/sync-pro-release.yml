name: Sync published NotchNook Pro release
on:
  workflow_dispatch:
  repository_dispatch:
    types: [pro-release-published]
permissions:
  contents: write
concurrency:
  group: notchnook-pro-release
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test scripts/sync-pro-release.test.mjs
      - run: node scripts/sync-pro-release.mjs
      - name: Commit validated release metadata
        run: |
          if git diff --quiet -- Casks/notchnook-v2.rb; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/notchnook-v2.rb
          git commit -m 'Sync published NotchNook Pro release'
          git push origin HEAD:main
